<!-- public/admin/login.html — Acesso ao dashboard do Admin -->
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Acesso Admin | Atelier by Rita</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="textura-papel pagina-login">

  <main class="cartao-login">
    <img src="/images/assinatura-rita.svg" alt="Rita Camoesas" height="48" class="logo-login" />
    <h1>Acesso ao painel</h1>
    <p class="lead">Área reservada à gestão do Atelier by Rita.</p>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" />
      </div>
      <div class="campo">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>

      <div class="cf-turnstile" data-sitekey="__TURNSTILE_SITE_KEY__"></div>

      <button type="submit" class="botao botao-primario botao-full">Entrar</button>
      <p id="erro-login" class="erro-login" role="alert" hidden></p>
    </form>
  </main>

  <script src="/js/admin/login.js" defer></script>
</body>
</html>
