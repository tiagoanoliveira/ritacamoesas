<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />

  <title>Acesso administrativo | Atelier by Rita</title>

  <link rel="stylesheet" href="/css/tailwind.css" />

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer
  ></script>
</head>

<body class="grid min-h-screen place-items-center bg-dusty-taupe px-4 py-12 font-sans text-pale-oak-dark antialiased">
  <main class="w-full max-w-md bg-floral-white p-4 rounded-xl shadow-raised sm:p-6">
    <div class="flex gap-4">
      <a href="/" class="flex-1 inline-flex min-h-11 items-center" aria-label="Voltar ao website">
        <img
          src="/images/atelier-logo.png"
          alt="Rita Camoesas"
          width="72"
          height="72"
          class="h-18 w-auto rounded-xl border border-solid border-pale-oak-dark"
        />
      </a>
      <div class="flex-4 mt-2">
        <p class="text-xs font-bold uppercase tracking-[0.18em] text-pale-oak">
          Área reservada
        </p>

        <h1 class="font-display text-4xl font-semibold tracking-tight">
          Login
        </h1>
      </div>
    </div>
    <form id="form-login" class="mt-4 grid gap-2" novalidate>
      <div>
        <label for="email" class="block text-sm font-bold">Email</label>

        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="username"
          class="mt-2 min-h-11 w-full border border-dusty-taupe bg-white/60 px-3 py-2 outline-none focus:border-camel focus:ring-2 focus:ring-camel/20"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-bold">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          class="mt-2 mb-2 min-h-11 w-full border border-dusty-taupe bg-white/60 px-3 py-2 outline-none focus:border-camel focus:ring-2 focus:ring-camel/20"
        />
      </div>

      <div class="cf-turnstile flex justify-center " data-sitekey="0x4AAAAAAEkxCVnMzInROtYn"></div>

      <button
        type="submit"
        class="rounded-xl inline-flex min-h-12 w-full items-center justify-center bg-dusty-taupe px-6 py-3 text-sm font-extrabold text-floral-white hover:bg-tan hover:text-black disabled:cursor-wait disabled:opacity-50"
      >
        Entrar
      </button>

      <p
        id="erro-login"
        class="border border-danger/30 bg-danger/10 p-4 text-sm font-semibold text-danger"
        role="alert"
        hidden
      ></p>
    </form>

    <a
      href="/"
      class="mt-4 inline-flex items-center text-sm font-semibold text-dusty-taupe hover:text-tan"
    >
      <span aria-hidden="true" class="mr-2">←</span>
      Voltar ao website
    </a>
  </main>

  <script src="/js/admin/login.js" defer></script>
</body>
</html>
