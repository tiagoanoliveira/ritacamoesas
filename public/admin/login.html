<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />

  <title>Acesso administrativo | Atelier by Rita</title>

  <link rel="stylesheet" href="/css/tailwind.css" />

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer
  ></script>
</head>

<body class="grid min-h-screen place-items-center bg-ink px-4 py-12 font-sans text-ink antialiased">
  <main class="w-full max-w-md bg-cream p-7 shadow-raised sm:p-10">
    <a href="/" class="inline-flex min-h-11 items-center" aria-label="Voltar ao website">
      <img
        src="/images/rita.svg"
        alt="Rita Camoesas"
        width="170"
        height="48"
        class="h-12 w-auto"
      />
    </a>

    <p class="mt-10 text-xs font-bold uppercase tracking-[0.18em] text-amber">
      Área reservada
    </p>

    <h1 class="mt-2 font-display text-4xl font-semibold tracking-tight">
      Acesso ao painel
    </h1>

    <p class="mt-3 text-base text-ink/65">
      Gestão do Atelier by Rita.
    </p>

    <form id="form-login" class="mt-8 grid gap-6" novalidate>
      <div>
        <label for="email" class="block text-sm font-bold">Email</label>

        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="username"
          class="mt-2 min-h-11 w-full border border-ink/20 bg-white/60 px-3 py-2 outline-none focus:border-amber focus:ring-2 focus:ring-amber/20"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-bold">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          class="mt-2 min-h-11 w-full border border-ink/20 bg-white/60 px-3 py-2 outline-none focus:border-amber focus:ring-2 focus:ring-amber/20"
        />
      </div>

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEkxCVnMzInROtYn"></div>

      <button
        type="submit"
        class="inline-flex min-h-12 w-full items-center justify-center bg-ink px-6 py-3 text-sm font-extrabold text-cream hover:bg-amber disabled:cursor-wait disabled:opacity-50"
      >
        Entrar
      </button>

      <p
        id="erro-login"
        class="border border-danger/30 bg-danger/10 p-4 text-sm font-semibold text-danger"
        role="alert"
        hidden
      ></p>
    </form>

    <a
      href="/"
      class="mt-8 inline-flex min-h-11 items-center text-sm font-semibold text-ink/60 hover:text-amber"
    >
      <span aria-hidden="true" class="mr-2">←</span>
      Voltar ao website
    </a>
  </main>

  <script src="/js/admin/login.js" defer></script>
</body>
</html>
