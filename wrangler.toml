# wrangler.toml
# Configuração do projeto Cloudflare Pages (com Pages Functions) para o
# website "Atelier by Rita". Publicar via: wrangler pages deploy ./public

name = "atelier-by-rita"
compatibility_date = "2026-08-01"
pages_build_output_dir = "public"

# ---------- Base de dados D1 ----------
[[d1_databases]]
binding = "DB"
database_name = "atelier-db"
database_id = "<PREENCHER_APOS_CRIAR_COM_wrangler_d1_create>"

# ---------- Armazenamento de imagens/ficheiros ----------
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "atelier-media"

# ---------- Variáveis e segredos ----------
# Definir os segredos reais com:
#   wrangler pages secret put RESEND_API_KEY
#   wrangler pages secret put TURNSTILE_SECRET_KEY
#   wrangler pages secret put JWT_SECRET
# Nunca colocar chaves reais neste ficheiro (fica no repositório).
[vars]
SITE_URL = "https://atelierbyrita.pt"
EMAIL_FROM = "reservas@atelierbyrita.pt"
RESERVA_PRAZO_HORAS = "24"

# ---------- Cron trigger (opcional, fase 2) ----------
# Usado apenas para enviar EMAIL DE AVISO 2h antes do fim do prazo de
# pagamento (o cancelamento em si é sempre uma decisão manual do Admin,
# conforme especificado — nunca cancelamos automaticamente por código).
[triggers]
crons = ["0 * * * *"]