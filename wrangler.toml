Já criei os ficheiros: 0001_init.sql (schema completo com triggers que atualizam vagas automaticamente), wrangler.toml, reservas_index.js (POST de reserva pública), reservas_admin.js (gestão de reservas no dashboard, incluindo a lógica de "Sem pagamento" → cancelar → libertar vaga), tokens.css (sistema de design) e index.html (homepage).

Modelo de Dados
Tabela	Campos-chave
eventos	slug, titulo, descrição, temática, duração, data, preço (cêntimos), vagas_max/ocupadas, localização (+ flag de excepção), janela de abertura/fecho de reservas
evento_imagens	referência R2 por evento, com posição para carrossel
reservas	código único, dados do responsável, nº pessoas, método (mbway/transferência), estado (pendente/confirmada/sem_pagamento/cancelada), prazo de 24h
pedidos_orcamento	tipo de evento, nº pessoas, temática opcional, contacto, observações, estado e resposta do admin
admins	login do dashboard
Os triggers SQL garantem que vagas_ocupadas nunca desincroniza manualmente: ao inserir uma reserva pendente/confirmada, soma; ao cancelar ou marcar "sem pagamento", subtrai — implementando a RN04 sem lógica extra em cada endpoint.

Fluxo de Reserva (passo a passo)
Cliente escolhe evento, preenche formulário (nome, email, telefone, nº pessoas, observações, método de pagamento) e passa o Turnstile.

POST /api/reservas valida vagas disponíveis e janela de reservas, gera código único (ex: RB-7F3A2K), grava com estado = pendente e prazo_pagamento = agora + 24h.

Resend envia email com os dados de pagamento (MB Way / IBAN) e instrução explícita: o código tem de constar na descrição do pagamento.

Passado o prazo, é a Rita (dashboard) que decide: confirma pagamento → estado = confirmada; ou marca sem_pagamento → a reserva é automaticamente cancelada e a vaga volta ao público (a menos que a data limite de reservas já tenha passado, conforme RN04/RN05).

Design — Para Não Parecer "Feito por IA"
No tokens.css já deixei o raciocínio documentado: paleta terrosa (terracota, âmbar, verde-oliva) em vez do azul/roxo corporativo genérico, tipografia serifada editorial (Fraunces) para títulos em vez de sans-serif neutro, texturas de papel/traço manual em vez de glassmorphism, e — o mais importante — layout construído em torno da fotografia real, com hero assimétrico (texto + retrato grande) em vez do clichê "hero centrado + gradiente + botão".

Deixei marcadores <!-- PLACEHOLDER IMAGEM REAL --> na homepage nos pontos onde as fotos reais da Rita e do atelier devem substituir os placeholders — retrato hero, timeline do percurso, e galeria de eventos.

