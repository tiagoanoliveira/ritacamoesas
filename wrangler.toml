name = "atelier-by-rita"
compatibility_date = "2026-08-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "atelier-db"
database_id = "<PREENCHER_APOS_CRIAR_A_BASE_D1>"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "atelier-media"

[vars]
SITE_URL = "https://ritacamoesas.pt"
EMAIL_FROM = "reservas@ritacamoesas.pt"
RESERVA_PRAZO_HORAS = "24"